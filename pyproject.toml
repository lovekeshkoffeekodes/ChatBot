[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lovekesh", email = "lovekesh.koffeekodes@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.161.1",
    "langchain>=1.4.7",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.16",
    "langsmith>=0.14.12",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
chatbot = "chatbot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
