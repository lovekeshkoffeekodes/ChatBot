[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lovekesh", email = "lovekesh.koffeekodes@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langsmith>=0.14.12",
    "psycopg[binary]>=3.3.6",
    "psycopg2>=2.9.13",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.6",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.16.1",
    "alembic>=1.20.1",
    "langchain-huggingface>=1.2.3",
    "pypdf>=6.21.4",
    "sentence-transformers>=6.2.0",
    "langchain-postgres>=0.0.19",
    "pgvector>=0.3.6",
    "langchain-core>=1.7.0",
    "active>=0.0.5a0",
]

[project.scripts]
chatbot = "chatbot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
